name: Kittygram CI/CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kittygram-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend_tests:
    name: Backend checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10']
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: kittygram
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: kittygram
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kittygram -d kittygram"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: kittygram
      POSTGRES_USER: kittygram
      POSTGRES_PASSWORD: test-password
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: 'False'
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r requirements-dev.txt
      - name: Check Python code
        run: ruff check backend scripts

      - name: Check Python formatting
        run: ruff format --check backend scripts

      - name: Check Python style
        run: pycodestyle backend scripts

      - name: Check workflow copy
        run: cmp .github/workflows/main.yml kittygram_workflow.yml
      - name: Check Django and migrations
        run: |
          python backend/manage.py check
          python backend/manage.py makemigrations --check --dry-run
      - name: Run backend tests with PostgreSQL
        working-directory: backend
        run: python manage.py test --verbosity 2

  frontend_tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: 'true'
        run: npm test -- --watchAll=false --runInBand

  build_and_push:
    name: Publish ${{ matrix.component }}
    needs: [backend_tests, frontend_tests]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend

          - component: frontend
            context: frontend

          - component: gateway
            context: nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.context }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/kittygram_${{ matrix.component }}:latest
            ${{ secrets.DOCKER_USERNAME }}/kittygram_${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  notify:
    name: Notify in Telegram
    needs: [build_and_push]
    runs-on: ubuntu-latest
    steps:
      - name: Send success message
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
          PUSH_ACTOR: ${{ github.actor }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: https://github.com/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ['TELEGRAM_TOKEN']
          chat_id = os.environ['TELEGRAM_TO']
          if not token or not chat_id:
              raise SystemExit('Set TELEGRAM_TOKEN and TELEGRAM_TO repository secrets')
          message = (
              'Kittygram: tests passed; all three images published to Docker Hub.\n'
              f'Push author: {os.environ["PUSH_ACTOR"]}\n'
              f'Commit message: {os.environ["COMMIT_MESSAGE"][:2000]}\n'
              f'Commit: {os.environ["COMMIT_URL"]}\n'
              f'Workflow: {os.environ["RUN_URL"]}'
          )
          payload = json.dumps({
              'chat_id': chat_id,
              'text': message,
          }).encode()
          request = urllib.request.Request(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=payload,
              headers={'Content-Type': 'application/json'},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except Exception:
              raise SystemExit('Telegram request failed; check bot token and chat ID') from None
          if not result.get('ok'):
              raise SystemExit('Telegram rejected the message')
          PY
